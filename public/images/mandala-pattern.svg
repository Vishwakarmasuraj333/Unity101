<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Royal Golden Luminous Gradient for Unity 101 Events -->
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#F5C451" stop-opacity="0.88"/>
      <stop offset="70%" stop-color="#E5A823" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#C68A14" stop-opacity="0.92"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C451" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#E5A823" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#E5A823" stop-opacity="0"/>
    </radialGradient>

    <g id="petal">
      <path d="M 300,300 C 275,235 265,175 300,95 C 335,175 325,235 300,300 Z" fill="none" stroke="url(#goldStroke)" stroke-width="1.6"/>
      <path d="M 300,300 C 285,248 278,200 300,140 C 322,200 315,248 300,300 Z" fill="none" stroke="url(#goldStroke)" stroke-width="1.1" opacity="0.75"/>
      <circle cx="300" cy="112" r="4.5" fill="url(#goldStroke)" opacity="0.9"/>
      <path d="M 288,160 Q 300,142 312,160" fill="none" stroke="url(#goldStroke)" stroke-width="1" opacity="0.85"/>
    </g>

    <g id="outerPetal">
      <path d="M 300,300 C 255,195 235,115 300,35 C 365,115 345,195 300,300 Z" fill="none" stroke="url(#goldStroke)" stroke-width="1.6" opacity="0.85"/>
      <circle cx="300" cy="45" r="5" fill="url(#goldStroke)" opacity="0.95"/>
    </g>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Radial Ambient Center Glow -->
    <circle cx="300" cy="300" r="285" fill="url(#centerGlow)"/>

    <!-- Central Rings -->
    <circle cx="300" cy="300" r="28" fill="none" stroke="url(#goldStroke)" stroke-width="2.2"/>
    <circle cx="300" cy="300" r="48" fill="none" stroke="url(#goldStroke)" stroke-width="1.6" stroke-dasharray="4,4"/>
    <circle cx="300" cy="300" r="75" fill="none" stroke="url(#goldStroke)" stroke-width="1.9"/>
    <circle cx="300" cy="300" r="145" fill="none" stroke="url(#goldStroke)" stroke-width="1.3" stroke-dasharray="3,3"/>
    <circle cx="300" cy="300" r="210" fill="none" stroke="url(#goldStroke)" stroke-width="1.6"/>
    <circle cx="300" cy="300" r="260" fill="none" stroke="url(#goldStroke)" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Petals Rotated around center (12-fold symmetry) -->
    <g>
      <use href="#petal" transform="rotate(0 300 300)"/>
      <use href="#petal" transform="rotate(30 300 300)"/>
      <use href="#petal" transform="rotate(60 300 300)"/>
      <use href="#petal" transform="rotate(90 300 300)"/>
      <use href="#petal" transform="rotate(120 300 300)"/>
      <use href="#petal" transform="rotate(150 300 300)"/>
      <use href="#petal" transform="rotate(180 300 300)"/>
      <use href="#petal" transform="rotate(210 300 300)"/>
      <use href="#petal" transform="rotate(240 300 300)"/>
      <use href="#petal" transform="rotate(270 300 300)"/>
      <use href="#petal" transform="rotate(300 300 300)"/>
      <use href="#petal" transform="rotate(330 300 300)"/>
    </g>

    <!-- Outer Petals (interleaved) -->
    <g>
      <use href="#outerPetal" transform="rotate(15 300 300)"/>
      <use href="#outerPetal" transform="rotate(45 300 300)"/>
      <use href="#outerPetal" transform="rotate(75 300 300)"/>
      <use href="#outerPetal" transform="rotate(105 300 300)"/>
      <use href="#outerPetal" transform="rotate(135 300 300)"/>
      <use href="#outerPetal" transform="rotate(165 300 300)"/>
      <use href="#outerPetal" transform="rotate(195 300 300)"/>
      <use href="#outerPetal" transform="rotate(225 300 300)"/>
      <use href="#outerPetal" transform="rotate(255 300 300)"/>
      <use href="#outerPetal" transform="rotate(285 300 300)"/>
      <use href="#outerPetal" transform="rotate(315 300 300)"/>
      <use href="#outerPetal" transform="rotate(345 300 300)"/>
    </g>

    <!-- Center Jewel -->
    <circle cx="300" cy="300" r="9" fill="url(#goldStroke)"/>
  </g>
</svg>
