<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D97706" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(200, 110)">
    <!-- Laurel Wreath Left -->
    <path d="M -15,55 C -45,45 -65,15 -65,-20 C -65,-45 -45,-70 -15,-80 C -25,-65 -30,-45 -30,-20 C -30,15 -15,45 -15,55 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M -45,15 C -60,0 -70,-20 -60,-35 C -50,-25 -45,-5 -45,15 Z" fill="url(#goldGrad)"/>
    <path d="M -30,-40 C -40,-55 -40,-75 -25,-85 C -20,-70 -25,-55 -30,-40 Z" fill="url(#goldGrad)"/>
    <path d="M -15,-70 C -15,-85 -5,-95 5,-100 C 0,-88 -5,-78 -15,-70 Z" fill="url(#goldGrad)"/>

    <!-- Laurel Wreath Right -->
    <path d="M 15,55 C 45,45 65,15 65,-20 C 65,-45 45,-70 15,-80 C 25,-65 30,-45 30,-20 C 30,15 15,45 15,55 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M 45,15 C 60,0 70,-20 60,-35 C 50,-25 45,-5 45,15 Z" fill="url(#goldGrad)"/>
    <path d="M 30,-40 C 40,-55 40,-75 25,-85 C 20,-70 25,-55 30,-40 Z" fill="url(#goldGrad)"/>
    <path d="M 15,-70 C 15,-85 5,-95 -5,-100 C 0,-88 5,-78 15,-70 Z" fill="url(#goldGrad)"/>

    <!-- Inner circle ring -->
    <circle cx="0" cy="-20" r="52" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="3,2"/>
    <circle cx="0" cy="-20" r="47" fill="#FFFDF5" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- Radio Waves Top Right -->
    <path d="M 28,-72 A 55 55 0 0 1 65,-35" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 36,-80 A 68 68 0 0 1 78,-38" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 44,-88 A 82 82 0 0 1 91,-41" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- 20th text -->
    <text x="0" y="-12" font-family="'Cinzel', 'Times New Roman', serif" font-size="44" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-1">20</text>
    <text x="32" y="-32" font-family="'Cinzel', 'Times New Roman', serif" font-size="16" font-weight="bold" fill="url(#goldGrad)">th</text>
    <text x="0" y="8" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">ANNIVERSARY 2026</text>

    <!-- Small stars -->
    <circle cx="-32" cy="-20" r="1.5" fill="url(#goldGrad)"/>
    <circle cx="32" cy="-20" r="1.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography Brand Header -->
  <g transform="translate(200, 220)">
    <!-- UNITY 101 text -->
    <text x="0" y="20" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="5">UNITY 101</text>
    
    <!-- COMMUNITY RADIO subtitle -->
    <text x="0" y="44" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">COMMUNITY RADIO</text>
    
    <!-- Gold accent line -->
    <line x1="-120" y1="56" x2="120" y2="56" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="56" r="3" fill="url(#goldGrad)"/>
  </g>
</svg>
